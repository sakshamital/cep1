{% extends "admin/base_admin.html" %}

{% block title %}Sign In — DocumentReady Admin{% endblock %}

{% block admin_content %}
<div style="max-width: 400px; margin: 60px auto;">
  <div class="card card--elevated" style="padding: var(--space-6);">
    <div style="text-align:center; margin-bottom: var(--space-4);">
      <h2 style="margin-bottom: 6px; font-size: var(--font-size-xl);">Admin Sign In</h2>
      <p style="color: var(--grey); font-size: var(--font-size-sm); margin:0;">
        Sign in with authorized administrator credentials.
      </p>
    </div>

    <form method="POST" action="{{ url_for('admin.login_view', next=request.args.get('next')) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div style="margin-bottom: var(--space-4);">
        <label for="username" style="display:block; font-size:var(--font-size-sm); font-weight:600; margin-bottom:6px;">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          required
          autofocus
          class="search-input"
          style="padding-left:14px; width:100%; border-radius:var(--radius-sm);"
          placeholder="admin"
        />
      </div>

      <div style="margin-bottom: var(--space-6);">
        <label for="password" style="display:block; font-size:var(--font-size-sm); font-weight:600; margin-bottom:6px;">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          class="search-input"
          style="padding-left:14px; width:100%; border-radius:var(--radius-sm);"
        />
      </div>

      <button type="submit" class="btn btn--primary" style="width:100%; justify-content:center;">
        Sign In to Console
      </button>
    </form>
  </div>
</div>
{% endblock %}
