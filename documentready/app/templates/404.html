{% extends "base.html" %}
{% block title %}Page Not Found — DocumentReady{% endblock %}
{% block content %}
<section class="page-header">
  <div class="container" style="text-align:center;">
    <h1 style="font-size:5rem; margin-bottom:var(--space-4); opacity:0.3;">404</h1>
    <h2 style="color:var(--white); margin-bottom:var(--space-4);">Page Not Found</h2>
    <p style="color:rgba(255,255,255,0.75); margin-bottom:var(--space-6);">
      We couldn't find what you were looking for.
    </p>
    <a href="{{ url_for('pages.index') }}" class="btn btn--teal btn--lg">← Go Back Home</a>
  </div>
</section>
{% endblock %}
